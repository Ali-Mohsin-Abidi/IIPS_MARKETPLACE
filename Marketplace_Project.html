<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIPS Marketplace</title>
  <style>
    /* Clean foundational styles for readability */
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f6f8; color: #333; }
    header { background: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
    nav button { background: #007bff; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin-left: 8px; font-weight: 600; }
    nav button:hover { opacity: 0.9; }
    main { max-width: 900px; margin: 30px auto; padding: 0 15px; }
    fieldset { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fff; }
    legend { font-weight: bold; color: #007bff; }
    label { display: block; margin-top: 10px; font-size: 0.9rem; font-weight: 500; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    dialog { border: none; border-radius: 12px; padding: 20px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    dialog::backdrop { background: rgba(0,0,0,0.5); }
  </style>
</head>
<body>

  <!-- 1. HEADER / NAVBAR -->
  <header>
    <div class="logo">
      <h1 style="margin: 0; font-size: 1.5rem; color: #007bff;">IIPS Marketplace</h1>
    </div>
    <nav>
      <button id="openFormBtn">+ Create New Listing</button>
      <button id="viewManagerBtn">Manager Dashboard (<span id="pendingCount">0</span>)</button>
    </nav> 
  </header>

  <!-- 2. MAIN CONTENT SECTIONS -->
  <main>
    <!-- Live Marketplace Feed -->
   <!-- Live Marketplace Feed -->
    <section id="marketplaceSection">
      <h2>Live Campus Listings</h2>
      
      <!-- Search Bar Input -->
      <div style="margin: 15px 0;">
        <input type="text" id="searchInput" placeholder="🔍 Search by title, description, or keywords..." style="padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
      </div>

      <div id="listingsContainer">
        <!-- Approved listings render here dynamically -->
      </div>
    </section>

    <!-- Manager Review Dashboard -->
    <section id="managerSection" hidden>
      <h2>Manager Approval Queue</h2>
      <p style="color: #666;">Review submitted listings before they appear on the live campus feed.</p>
      <div id="pendingListingsContainer">
        <!-- Pending listings render here dynamically -->
      </div>
    </section>
  </main>

  <!-- 3. MODAL FORM FOR CREATING LISTING -->
  <dialog id="listingModal">
    <div>
      <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 15px;">
        <h3 style="margin: 0;">Create New Listing</h3>
        <button type="button" id="closeModalBtn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #666;">&times;</button>
      </header>

      <form id="listingForm">
        <!-- Seller Info Section -->
        <fieldset>
          <legend>Seller Information</legend>
          
          <label for="sellerName">Full Name:</label>
          <input type="text" id="sellerName" name="sellerName" placeholder="e.g., Rohan Kumar" required>

          <label for="sellerphotos">Seller Face Image:</label>
          <input type="file" id="sellerphotos" name="sellerphotos" accept="image/*" required>

          <label for="phone">Phone Number (Calls):</label>
          <input type="tel" id="phone" name="phone" placeholder="+91 9876543210" required>

          <label for="whatsapp">WhatsApp Number:</label>
          <input type="tel" id="whatsapp" name="whatsapp" placeholder="+91 9876543210" required>
        </fieldset>

        <!-- Product Details Section -->
        <fieldset>
          <legend>Product Details</legend>

          <label for="title">Product Title:</label>
          <input type="text" id="title" name="title" placeholder="e.g., Casio Scientific Calculator / Textbooks" required>

          <label for="price">Price (₹):</label>
          <input type="number" id="price" name="price" placeholder="500" min="0" required>

          <label for="productPhotos">Product Images (Select multiple):</label>
          <input type="file" id="productPhotos" name="productPhotos" accept="image/*" multiple required>

          <label for="usage">Usage / Condition:</label>
          <select id="usage" name="usage" required>
            <option value="">Select Condition</option>
            <option value="Like New (Barely Used)">Like New (Barely Used)</option>
            <option value="Good (Slight Wear)">Good (Slight Wear)</option>
            <option value="Fair (Well Used)">Fair (Well Used)</option>
          </select>

          <label for="warranty">Warranty Details:</label>
          <input type="text" id="warranty" name="warranty" placeholder="e.g., 6 months left / No warranty" required>

          <label for="description">Product Description:</label>
          <textarea id="description" name="description" rows="3" placeholder="Mention features, pickup spot in campus, etc." required></textarea>
        </fieldset>

        <footer style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
          <button type="button" id="cancelFormBtn" style="background: #6c757d; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer;">Cancel</button>
          <button type="submit" style="background: #28a745; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold;">Submit for Approval</button>
        </footer>
      </form>
    </div>
  </dialog>

  <!-- 4. DETAILED AD VIEW MODAL -->
  <dialog id="adDetailModal" style="max-width: 650px;">
    <div>
      <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px;">
        <h3 id="detailTitle" style="margin: 0; font-size: 1.3rem;">Product Details</h3>
        <button type="button" onclick="document.getElementById('adDetailModal').close()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #666;">&times;</button>
      </header>

      <!-- Image Gallery Section -->
      <div style="margin-bottom: 15px;">
        <div style="text-align: center; background: #000; border-radius: 8px; overflow: hidden; height: 250px; display: flex; align-items: center; justify-content: center;">
          <img id="detailMainImage" src="" alt="Main Preview" style="max-width: 100%; max-height: 250px; object-fit: contain;">
        </div>
        <!-- Thumbnails row -->
        <div id="detailThumbnailsContainer" style="display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 5px;"></div>
      </div>

      <!-- Product Info Grid -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; background: #f8f9fa; padding: 12px; border-radius: 8px;">
        <div><strong>Price:</strong> <span id="detailPrice" style="color: #28a745; font-size: 1.1rem; font-weight: bold;"></span></div>
        <div><strong>Condition:</strong> <span id="detailUsage"></span></div>
        <div><strong>Warranty:</strong> <span id="detailWarranty"></span></div>
      </div>

      <div style="margin-bottom: 15px;">
        <strong>Description:</strong>
        <p id="detailDescription" style="color: #444; margin: 5px 0 0 0; line-height: 1.4;"></p>
      </div>

      <div style="border-top: 1px solid #ddd; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <img id="detailSellerPhoto" src="" alt="Seller" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover;">
          <div>
            <span style="font-size: 0.85rem; color: #666; display: block;">Posted by</span>
            <strong id="detailSellerName" style="font-size: 0.95rem;"></strong>
          </div>
        </div>
        <div style="display: flex; gap: 8px;">
          <a id="detailCallBtn" href="#" style="background: #007bff; color: white; padding: 8px 14px; text-decoration: none; border-radius: 4px; font-size: 0.9rem;">📞 Call</a>
          <a id="detailWhatsappBtn" href="#" target="_blank" style="background: #25D366; color: white; padding: 8px 14px; text-decoration: none; border-radius: 4px; font-size: 0.9rem;">💬 WhatsApp</a>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Main Script File Linking -->
  <script src="Marketplace_Project.js"></script>
</body>
</html>
